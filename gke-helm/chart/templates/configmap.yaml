# =============================================================================
# configmap.yaml - Konfigurasi aplikasi (environment variables non-sensitif)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.appName }}-config
  labels:
    {{- include "gke-app.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
