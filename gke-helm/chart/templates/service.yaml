# =============================================================================
# service.yaml - Expose Deployment
# -----------------------------------------------------------------------------
# values.service.internal=true -> Internal LoadBalancer (hanya bisa diakses
# dari dalam VPC). Set false untuk LoadBalancer publik.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}
  labels:
    {{- include "gke-app.labels" . | nindent 4 }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.internal }}
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
  {{- end }}
  # `and (eq A "LoadBalancer") B` = dua kondisi sekaligus: type-nya persis
  # "LoadBalancer" DAN internal: true. Cuma kalau KEDUANYA benar, anotasi ini
  # dipasang. Beda dari labels: annotations bukan buat matching Kubernetes,
  # ini dibaca CONTROLLER GKE (di luar cluster) yang beneran bikin Load
  # Balancer di GCP — anotasi ini yang bilang "buat versi internal, bukan publik".
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Values.appName }}
  # Service TIDAK TAHU Pod mana yang ada — ia terus mencari Pod berlabel
  # app: <appName> ini (sama seperti selector di deployment.yaml), siapa pun
  # yang cocok otomatis jadi tujuan trafik. Ini yang bikin Pod boleh mati-
  # hidup ganti IP tanpa mengganggu akses lewat Service.
  ports:
    - name: http
      port: {{ .Values.service.port }}        # port yang dipakai CLIENT (curl http://IP:80/...)
      targetPort: {{ .Values.appPort }}        # port di DALAM Pod yang sebenarnya dihubungi
  # port dan targetPort boleh beda (80 di luar -> 5000 di dalam Pod) — inilah
  # kenapa curl ke port 80 (default HTTP, tidak perlu ditulis) tetap sampai
  # ke aplikasi yang listen di 5000.
