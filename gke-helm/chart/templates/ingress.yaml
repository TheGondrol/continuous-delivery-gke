# =============================================================================
# ingress.yaml - Ingress INTERNAL (GKE internal HTTP(S) Load Balancer)
# -----------------------------------------------------------------------------
# Butuh proxy-only subnet & firewall internal LB tersedia di VPC. Set
# values.ingress.enabled=false bila prasyarat itu belum ada.
# =============================================================================
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.appName }}
  labels:
    {{- include "gke-app.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}
spec:
  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ .Values.appName }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
