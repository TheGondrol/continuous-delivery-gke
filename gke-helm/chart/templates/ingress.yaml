# =============================================================================
# ingress.yaml - Ingress INTERNAL (GKE internal HTTP(S) Load Balancer)
# -----------------------------------------------------------------------------
# Butuh proxy-only subnet & firewall internal LB tersedia di VPC. Set
# values.ingress.enabled=false bila prasyarat itu belum ada.
# =============================================================================
{{- if .Values.ingress.enabled }}
# Sama pola dengan hpa.yaml: kalau false, SELURUH resource Ingress ini tidak
# dikirim ke cluster — akses tetap bisa lewat Service (service.yaml) saja.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.appName }}
  labels:
    {{- include "gke-app.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}
spec:
  rules:                             # list — bisa ada banyak aturan routing (mis. /api vs /admin)
    - http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ .Values.appName }}
                port:
                  number: {{ .Values.service.port }}
  # backend.service mengarah ke Service yang SAMA dari service.yaml. Ingress
  # ini murni "pintu masuk HTTP" yang meneruskan ke Service — ia tidak
  # langsung bicara ke Pod, cuma ke Service, yang baru dari situ ke Pod.
{{- end }}
