# =============================================================================
# skaffold.yaml - Resep render & deploy yang dibaca Cloud Deploy (target GKE)
# -----------------------------------------------------------------------------
# - Tidak ada build: CI sudah selesai di on-prem, image datang dari Nexus.
# - Cloud Deploy meng-inject image aktual ke manifest saat release (--images),
#   menggantikan placeholder pada field `image:` di deployment.yaml.
# - Profile hanya perlu didefinisikan namanya; manifest default dipakai semua.
#   Tambahkan override per-profile di sini bila environment mulai berbeda.
# =============================================================================
apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: APP_NAME-gke-config

build:
  artifacts: []

manifests:
  rawYaml:
    - manifests/configmap.yaml
    # secret.yaml TIDAK ada di repo — release.sh menghasilkannya dari Vault ke
    # dalam workdir sementara sebelum `gcloud deploy releases create --source`.
    # Selalu dirender (kosong bila Vault nonaktif), jadi daftar ini tetap valid.
    - manifests/secret.yaml
    - manifests/deployment.yaml
    - manifests/service.yaml
    - manifests/hpa.yaml
    - manifests/ingress.yaml

deploy:
  kubectl: {}

profiles:
  - name: dev
  # --- Aktifkan bersamaan dengan target di clouddeploy.yaml ---
  # - name: staging
  # - name: prod
